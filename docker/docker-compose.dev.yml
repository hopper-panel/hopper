# Supporting services for local development.
# Do NOT use in production: the passwords are in clear text and the ports are
# published on the host.
name: hopper-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: hopper-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hopper
      POSTGRES_PASSWORD: hopper
      POSTGRES_DB: hopper
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hopper']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hopper-dev-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
