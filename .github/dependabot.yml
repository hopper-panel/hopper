version: 2

# Hopper runs arbitrary code in containers and holds encrypted secrets, so a
# dependency with a known hole matters more here than on an ordinary web app.
#
# Updates are grouped: one pull request per ecosystem for the routine minor and
# patch bumps, and a separate one per major, which needs to be read. Ungrouped,
# a monorepo of this size produces a dozen pull requests a week and they stop
# being read at all.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patches and minors are grouped **separately**, and the reason is worth
      # keeping. Under semver a 0.x minor is the breaking channel: 0.4 → 0.5 of
      # eslint-plugin-react-refresh moved the plugin behind a named export and
      # ESLint stopped running altogether. Dependabot still labels that "minor",
      # so grouping it with patches took three harmless updates down with it and
      # the whole pull request had to be untangled by hand.
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
    ignore:
      # Major bumps of these land through a deliberate migration, never through
      # an automated pull request: each one changes behaviour the panel relies
      # on, and the CI would go green on a change nobody read.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      # @types/node tracks the Node major it describes, so its version is not
      # ours to choose: it has to match the runtime, which is pinned to 22 in
      # package.json, the CI workflow and install.sh. Taking @types/node 26 on
      # Node 22 makes the compiler accept APIs that are not there at run time —
      # a crash that typechecks cleanly. It moves when the runtime moves.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the compiler rewritten in Go, not a version of the one
      # the toolchain is built against. typescript-eslint and the vitest
      # transform both reach into the old compiler's internals and both die on
      # it the same way — `Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')` — so lint, typecheck and the tests all
      # stop at once. Nothing in this repository can fix that; it moves when
      # those tools support it, as a migration somebody drives.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # No docker ecosystem entry: the servers run the official eclipse-temurin
  # images, named in `packages/templates`, and nothing in this repository builds
  # a Dockerfile. Those images are pulled by tag, so a base image patch reaches
  # a server on its next restart without anything to update here.
