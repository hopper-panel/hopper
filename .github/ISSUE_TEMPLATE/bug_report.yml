name: 🐛 Rapport de bug
description: Signaler un comportement incorrect
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        **Ne signalez pas une faille de sécurité ici.** Voir [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s'est-il passé, et qu'attendiez-vous à la place ?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Créer un serveur Paper 1.21
        2. Cliquer sur Démarrer
        3. …
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      options:
        - Panel (API)
        - Panel (interface web)
        - Daemon (hopperd)
        - SFTP
        - Installeur
        - Templates de serveurs
        - Je ne sais pas
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de Hopper
      placeholder: 'v0.1.0 ou commit git'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      placeholder: |
        OS : Debian 13
        Docker : 27.3.1
        Node : 22.15.0
        Base de données : PostgreSQL 17
        Reverse proxy : nginx
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Journaux du panel et/ou du daemon. Retirez tout jeton ou mot de passe.
      render: shell
