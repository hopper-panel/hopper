name: 🐛 Bug report
description: Report incorrect behaviour
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security vulnerability here.** See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a Paper 1.21 server
        2. Click Start
        3. …
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component concerned
      options:
        - Panel (API)
        - Panel (web interface)
        - Daemon (hopperd)
        - SFTP
        - Installer
        - Server templates
        - I do not know
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hopper version
      placeholder: 'v0.1.0 or a git commit'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Debian 13
        Docker: 27.3.1
        Node: 22.15.0
        Database: PostgreSQL 17
        Reverse proxy: nginx
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Panel and/or daemon logs. Strip any token or password.
      render: shell
