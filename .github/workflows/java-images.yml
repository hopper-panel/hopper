name: Java images

# The runtime images the Minecraft servers run in. Every template in the
# catalogue names one — `ghcr.io/hopper-panel/java:21` and its siblings — so
# until this workflow has run, creating a server fails at the pull with
# "error from registry: denied" and there is nothing an operator can do about
# it.
#
# Only the images are built here, never the panel: they change on their own
# schedule (a base image patch, a new Java release) and rebuilding them on every
# commit would push five multi-architecture images for a typo in a comment.

on:
  push:
    branches: [main]
    paths:
      - 'docker/java/**'
      - '.github/workflows/java-images.yml'
  # Also runnable by hand: a base image gets security patches without anything
  # changing in this repository, and the published image should follow.
  workflow_dispatch:

concurrency:
  group: java-images
  cancel-in-progress: false

jobs:
  build:
    name: java:${{ matrix.java }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing version must not cancel the others: an image that builds is
      # worth publishing even if another is broken.
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on an amd64 runner. It is slow — several minutes for
      # the apt step alone — but a panel meant to be self-hosted has to run on
      # the ARM machines people actually rent.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/java
          build-args: JAVA_VERSION=${{ matrix.java }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hopper-panel/java:${{ matrix.java }}
          # Keeps the apt layer between runs; without it every manual rebuild
          # pays for the emulated arm64 install again.
          cache-from: type=gha,scope=java-${{ matrix.java }}
          cache-to: type=gha,scope=java-${{ matrix.java }},mode=max
          provenance: false

      # The image is useless if a node cannot pull it anonymously: hopperd holds
      # no registry credentials, and asking every operator for a GitHub token to
      # start a Minecraft server would defeat the point.
      - name: Check the image is public
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ghcr.io/v2/hopper-panel/java/manifests/${{ matrix.java }}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json')
          if [ "$code" = 200 ]; then
            echo "java:${{ matrix.java }} is pullable anonymously."
          else
            echo "::warning::java:${{ matrix.java }} answers $code without credentials."
            echo "Set the package to public: Organisation → Packages → java → Package settings."
          fi
