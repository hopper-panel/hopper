name: Installer

# Runs install.sh on a blank machine and then uses what it built.
#
# Everything CI checked until now — lint, typecheck, build, unit tests — was
# green through a run of releases in which the reinstall route answered 404,
# a failed installation left a server saying "Installing" for ever, and a
# server on any port other than 25565 was unreachable. Six of those nine
# defects were on the path this job walks, and every one of them was found by
# hand, on somebody's server, after release.
#
# So the assertions below are deliberately about outcomes an operator would
# notice, not about internals. A green unit suite has already proved it cannot
# see them.
#
# It runs on a GitHub runner rather than in a container: install.sh drives
# systemd and Docker, and neither works properly inside one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fixed so the installer and the end-to-end script share it. The instance
  # exists for eight minutes on a throwaway runner.
  HOPPER_ADMIN_PASSWORD: ci-password-not-a-secret

jobs:
  install:
    name: Install, then create a server on a non-default port
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The interview, on its own, before anything is installed.
      #
      # `--check` asks every question, prints the recap and stops — nothing
      # above that line writes anything, which is the property the whole script
      # is arranged around. It runs in a second, so the answers can be tried in
      # combinations no full installation would ever be spent on.
      #
      # Worth its own step: the questions are read from variables passed by
      # name, and bash scopes locals dynamically. A local named like the
      # caller's variable silently swallows the answer — with `ask_yes_no` that
      # means every yes/no question answers "no", on a script whose whole job
      # is to act on what it was told.
      - name: The questions, asked and answered
        env:
          HOPPER_NONINTERACTIVE: '1'
        run: |
          set -euo pipefail

          OUT=$(sudo -E env HOPPER_DOMAIN=panel.example.com HOPPER_WEBSERVER=none \
            HOPPER_ADMIN_EMAIL=ci@example.com HOPPER_ADMIN_USERNAME=ci \
            HOPPER_PANEL_NAME='CI panel' HOPPER_LOCALE=fr HOPPER_TIMEZONE=Europe/Paris \
            bash install/install.sh --check)
          printf '%s\n' "$OUT"

          # Every answer reaches the recap — the operator's only chance to see
          # what is about to happen.
          printf '%s' "$OUT" | grep -q 'http://panel.example.com:8080'
          printf '%s' "$OUT" | grep -q 'CI panel'
          printf '%s' "$OUT" | grep -qE 'Language +fr'
          printf '%s' "$OUT" | grep -q 'Europe/Paris'

          # And nothing on this machine moved.
          test ! -e /opt/hopper
          test ! -e /etc/hopper

          # A pasted URL is read as a host name. All three of APP_URL, the
          # vhost's server_name and the IP detection used to take the slash.
          sudo -E env HOPPER_DOMAIN=http://192.0.2.10/ HOPPER_WEBSERVER=none \
            HOPPER_ADMIN_EMAIL=ci@example.com HOPPER_ADMIN_USERNAME=ci \
            bash install/install.sh --check | grep -q 'domain read as 192.0.2.10'

          # A typo is refused with the choices named, at the moment it is made
          # — not several minutes later, after the machine has been changed.
          ! sudo -E env HOPPER_DOMAIN=panel.example.com HOPPER_WEBSERVER=ngnix \
            HOPPER_ADMIN_EMAIL=ci@example.com HOPPER_ADMIN_USERNAME=ci \
            bash install/install.sh --check

          # An unknown timezone would not fail where it lands: the container
          # falls back to UTC without a word, which is what the answer was
          # meant to change.
          ! sudo -E env HOPPER_DOMAIN=panel.example.com HOPPER_WEBSERVER=none \
            HOPPER_ADMIN_EMAIL=ci@example.com HOPPER_ADMIN_USERNAME=ci \
            HOPPER_TIMEZONE=Mars/Olympus bash install/install.sh --check

      - name: Run the installer
        env:
          # No domain: an IP address cannot receive a certificate, and the
          # certbot path needs public DNS pointing here. What this job covers
          # is the ordering that made the daemon read a certificate before it
          # existed — the readiness check below fails if the daemon does not
          # stay up, whichever branch was taken.
          HOPPER_NONINTERACTIVE: '1'
          HOPPER_WEBSERVER: none
          HOPPER_TLS: 'no'
          HOPPER_ADMIN_EMAIL: ci@example.com
          HOPPER_ADMIN_USERNAME: ci
          # Answered, so the rest of this job can check they were honoured. A
          # locale and a timezone that are not the defaults, because a default
          # proves nothing about whether the answer was read.
          HOPPER_LOCALE: fr
          HOPPER_TIMEZONE: Europe/Paris
          HOPPER_PANEL_NAME: CI panel
          # Installed from this checkout, not from the published repository:
          # the point is to test the branch under review.
          HOPPER_REPOSITORY: ${{ github.workspace }}
        run: sudo -E bash install/install.sh

      - name: The services are up, and stay up
        run: |
          set -euo pipefail
          sleep 10
          systemctl is-active --quiet hopper-panel || { sudo journalctl -u hopper-panel -n 40 --no-pager; exit 1; }
          systemctl is-active --quiet hopperd     || { sudo journalctl -u hopperd     -n 40 --no-pager; exit 1; }

      - name: The panel answers, and serves the bundle it advertises
        run: |
          set -euo pipefail
          # `/` answers 200 on a panel serving a stale bundle, which is how a
          # broken deployment survived three releases. Ask for the asset the
          # page actually references.
          ASSET=$(curl -fsS http://127.0.0.1:8080/ | grep -o 'assets/[A-Za-z0-9_-]*\.js' | head -1)
          test -n "$ASSET"
          curl -fsS -o /dev/null "http://127.0.0.1:8080/$ASSET"

      - name: A node exists, with ports to give out
        run: |
          set -euo pipefail
          # `hopper doctor` used to call an instance healthy with zero
          # allocations, on which no server can be created at all.
          sudo -u postgres psql -d hopper -tAc 'select count(*) from nodes' | grep -qv '^0$'

      # The two answers that had nowhere to go until now.
      #
      # A panel installed in one command answered in English and stamped every
      # game server's log in UTC, and both were settings the operator could
      # only reach after signing in — in English — to a panel called Hopper.
      - name: The language and the timezone that were asked for
        run: |
          set -euo pipefail

          test "$(sudo -u postgres psql -d hopper -tAc \
            "select value from settings where key = 'defaultLocale'")" = fr
          test "$(sudo -u postgres psql -d hopper -tAc \
            "select value from settings where key = 'panelName'")" = 'CI panel'

          # What the browser is served, which is the only version of this that
          # an operator experiences.
          curl -fsS http://127.0.0.1:8080/api/panel | grep -q '"locale":"fr"'

          # And the file the daemon reads, which is generated from the node row
          # — so this also says the row carries it.
          sudo grep -q 'timezone: Europe/Paris' /etc/hopper/daemon.yml

      - name: End to end — a server on a port that is not the default
        run: sudo -E bash .github/scripts/install-e2e.sh

      # Where the timezone was always going: `TZ` inside the container, which
      # is what puts the time on every line a game server prints.
      - name: A server runs on the timezone that was asked for
        run: |
          set -euo pipefail
          CID=$(sudo docker ps -aq --filter 'name=^hopper-' | head -1)
          test -n "$CID"
          sudo docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' |
            grep -qx 'TZ=Europe/Paris'

      # The two directories the panel's buttons write into, and the account
      # that has to be able to write them.
      #
      # `install.sh` created the updater's and not the node applier's, and
      # /var/lib/hopper belongs to root — so the units were installed, the
      # button was offered, and pressing it answered "Internal server error" on
      # every installation. Nothing above this line could see that: the panel
      # was up, the daemon was up, and a server had been created and started.
      - name: The panel can write the directories its own buttons use
        run: |
          set -euo pipefail
          for DIR in /var/lib/hopper/updates /var/lib/hopper/node-apply; do
            test -d "$DIR" || { ls -ld /var/lib/hopper; exit 1; }
            sudo -u hopper touch "$DIR/.probe"
            sudo rm -f "$DIR/.probe"
          done

      # And the whole chain behind the button, run for real: the panel asks, a
      # root unit writes /etc/hopper/daemon.yml and restarts hopperd.
      #
      # The mode is asserted because it is the entire reason this exists. A
      # daemon.yml left readable makes hopperd exit 78 at every start, five
      # times, and then stop trying — while the panel reports the node as
      # merely unreachable, which sends whoever is looking at it to the network.
      - name: The panel can configure the machine it runs on
        run: |
          set -euo pipefail
          API=http://127.0.0.1:8080

          TOKEN=$(curl -fsS -X POST "$API/api/auth/login" -H 'content-type: application/json' \
            -d "{\"identifier\":\"ci\",\"password\":\"$HOPPER_ADMIN_PASSWORD\"}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["accessToken"])')
          AUTH="authorization: Bearer $TOKEN"

          NODE=$(curl -fsS -H "$AUTH" "$API/api/admin/nodes?perPage=10" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"][0]["uuid"])')

          # The body, not just the status: when the panel refuses, its message
          # is the whole point of the refusal — and `curl -f` prints none of
          # it, leaving a step that failed with "exit code 22".
          CODE=$(curl -sS -o /tmp/apply.json -w '%{http_code}' \
            -X POST -H "$AUTH" "$API/api/admin/nodes/$NODE/apply-locally")

          if [ "$CODE" != 202 ]; then
            cat /tmp/apply.json
            echo
            # The two things that make it refuse, printed together: the mount
            # namespace the panel actually runs in, and the directory it wants.
            systemctl show hopper-panel -p ReadWritePaths
            ls -ld /var/lib/hopper/node-apply || true
            exit 1
          fi

          STATE=unknown
          for _ in $(seq 1 30); do
            sleep 2
            STATE=$(curl -fsS -H "$AUTH" "$API/api/admin/nodes/local-apply/status" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["state"])')
            [ "$STATE" = succeeded ] && break
            [ "$STATE" = failed ] && break
          done

          if [ "$STATE" != succeeded ]; then
            curl -fsS -H "$AUTH" "$API/api/admin/nodes/local-apply/status" || true
            sudo journalctl -u hopper-node-apply -n 50 --no-pager || true
            exit 1
          fi

          test "$(sudo stat -c %a /etc/hopper/daemon.yml)" = 600

          # The daemon comes back, and answers with the token it was just
          # given: a rotation the panel failed to record would show up here as
          # a node that authenticates against nothing.
          for _ in $(seq 1 15); do
            sleep 2
            curl -fsS -o /dev/null -H "$AUTH" "$API/api/admin/nodes/$NODE/health" && exit 0
          done

          sudo journalctl -u hopperd -n 50 --no-pager || true
          exit 1

      # An operator reinstalled onto his LAN address, was told
      # `Panel : http://192.168.1.141`, and landed on the default nginx page:
      # `.env` and the vhost are both kept on a rerun, so the panel stayed on
      # the address typed weeks earlier while the script reported the new one.
      - name: Reinstalling with another address actually moves the panel
        env:
          HOPPER_NONINTERACTIVE: '1'
          # Pasted with a scheme and a trailing slash, as an operator did. Both
          # used to survive into APP_URL, into the daemon's allowed origins —
          # where a trailing slash never matches a browser's Origin — and into
          # server_name.
          HOPPER_DOMAIN: http://192.0.2.10/
          HOPPER_WEBSERVER: nginx
          HOPPER_TLS: 'no'
          HOPPER_ADMIN_EMAIL: ci@example.com
          HOPPER_ADMIN_USERNAME: ci
          HOPPER_REPOSITORY: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # A vhost left over from an earlier address, which is what the
          # operator had. Written by hand so the rewrite is exercised rather
          # than the first-time creation.
          sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
          printf 'server {\n    listen 80;\n    server_name 198.51.100.7;\n}\n' |
            sudo tee /etc/nginx/sites-available/hopper.conf >/dev/null
          sudo ln -sf /etc/nginx/sites-available/hopper.conf /etc/nginx/sites-enabled/hopper.conf

          OUT=$(sudo -E bash install/install.sh)
          printf '%s\n' "$OUT"

          # `sudo` on every read: `.env` is mode 600 and owned by root, which
          # is the point of it. Without it grep exits 2 — "cannot open" — and
          # the step fails while reporting nothing about the assertion.
          #
          # The address the script announces is the address it wrote.
          sudo grep -q '^APP_URL=http://192.0.2.10$' /opt/hopper/apps/panel/.env

          # The vhost answers for the new address, not the old one — otherwise
          # nginx serves its default site and the panel looks broken.
          sudo grep -q '192.0.2.10' /etc/nginx/sites-available/hopper.conf
          ! sudo grep -q '198.51.100.7' /etc/nginx/sites-available/hopper.conf

          # And a rerun that creates no administrator says how to get back in,
          # rather than printing nothing where the password used to be.
          printf '%s' "$OUT" | grep -q 'hopper user:password --username ci'

          # The node follows the address too. It did not: `.env` and the vhost
          # moved while the node row kept the name typed months earlier, so the
          # panel went on calling the daemon at an address nothing answered on
          # — and went on handing it an allowed origin for a panel that had
          # moved, which is "Origin not allowed" on every console.
          test "$(sudo -u postgres psql -d hopper -tAc 'select fqdn from nodes limit 1')" = 192.0.2.10

          systemctl is-active --quiet hopper-panel

      # The uninstall steps come last, because they destroy what everything
      # above built — which is exactly the machine an uninstaller has to be
      # tried on. A script of this kind is run once per installation, by
      # somebody in a hurry who will not read its output closely, so the one
      # place it can be rehearsed is here.
      #
      # `sh uninstall.sh` is what an operator typed, and on Debian `sh` is
      # dash: it ran the script and printed `$\033[1m` in place of every
      # heading, including the line saying what to type to confirm a deletion.
      - name: Started with sh, it still reads like English
        run: |
          set -euo pipefail
          OUT=$(sudo sh install/uninstall.sh --dry-run)
          printf '%s' "$OUT" | grep -q 'would be removed'
          ! printf '%s' "$OUT" | grep -q '033\['

      - name: The uninstaller says what it would do, and does not do it
        run: |
          set -euo pipefail
          sudo bash install/uninstall.sh --dry-run
          # A dry run that stopped a service would be the worst possible bug in
          # a script whose whole promise is that it changed nothing.
          systemctl is-active --quiet hopper-panel
          systemctl is-active --quiet hopperd
          test -d /opt/hopper

      - name: The uninstaller removes what the installer created
        run: |
          set -euo pipefail
          sudo bash install/uninstall.sh --purge --yes

          for UNIT in hopper-panel hopperd hopper-update.path hopper-update.service \
            hopper-node-apply.path hopper-node-apply.service; do
            ! systemctl is-active --quiet "$UNIT"
            test ! -e "/etc/systemd/system/$UNIT" -a ! -e "/etc/systemd/system/$UNIT.service"
          done

          test ! -e /opt/hopper
          test ! -e /etc/hopper
          test ! -e /usr/local/bin/hopper
          test ! -e /var/lib/hopper
          test ! -e /etc/nginx/sites-enabled/hopper.conf
          ! id hopper 2>/dev/null
          ! sudo docker network inspect hopper0 >/dev/null 2>&1
          test -z "$(sudo docker ps -aq --filter 'name=^hopper-')"
          # The database and its role are the panel's own records; --purge is
          # about the game files, and both go either way.
          test "$(sudo -u postgres psql -tAc "select count(*) from pg_database where datname='hopper'")" = 0
          test "$(sudo -u postgres psql -tAc "select count(*) from pg_roles where rolname='hopper'")" = 0

          # And what it must never touch: the services another application on
          # the machine could be sitting on.
          systemctl is-active --quiet postgresql
          systemctl is-active --quiet docker

      - name: Uninstalling twice is not an error
        run: sudo bash install/uninstall.sh --purge --yes

      - name: What the daemon said, if any of that failed
        if: failure()
        run: |
          sudo journalctl -u hopperd -n 200 --no-pager || true
          sudo journalctl -u hopper-panel -n 100 --no-pager || true
          sudo docker ps -a || true
